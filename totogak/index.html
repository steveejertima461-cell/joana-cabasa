<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowers For You</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at bottom, #1b1b36 0%, #080816 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      color: #fff;
      position: relative;
    }

    /* Ambient Night Sky */
    .stars {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      background: #ffffff;
      border-radius: 50%;
      animation: twinkle var(--duration, 3s) infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.15; transform: scale(0.8); }
      50% { opacity: 0.95; transform: scale(1.3); }
    }

    .moon {
      position: absolute;
      top: 36px;
      right: 48px;
      width: 58px;
      height: 58px;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #fef3c7 70%, #fde68a 100%);
      border-radius: 50%;
      box-shadow: 0 0 35px rgba(254, 243, 199, 0.75), 0 0 70px rgba(254, 243, 199, 0.35);
      z-index: 1;
      pointer-events: none;
    }

    .moon::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      top: 15px;
      left: 28px;
      background: rgba(220, 205, 160, 0.35);
      border-radius: 50%;
      filter: blur(1.5px);
    }

    /* Falling Floating Rose Petals Container */
    .falling-petals-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 2;
    }

    .drifting-petal {
      position: absolute;
      top: -30px;
      width: 16px;
      height: 22px;
      background: radial-gradient(circle at 40% 30%, #fb7185 0%, #e11d48 60%, #880825 100%);
      border-radius: 50% 50% 35% 35% / 60% 60% 40% 40%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      opacity: 0.85;
      animation: driftDown var(--fall-duration, 8s) linear infinite;
    }

    @keyframes driftDown {
      0% {
        transform: translateY(-30px) rotate(0deg) scale(0.8);
        opacity: 0;
      }
      10% { opacity: 0.9; }
      90% { opacity: 0.8; }
      100% {
        transform: translateY(105vh) rotate(360deg) translateX(var(--drift-x, 40px)) scale(1.1);
        opacity: 0;
      }
    }

    /* Title */
    .title {
      position: absolute;
      top: 36px;
      font-size: 2.6rem;
      font-family: 'Great Vibes', cursive;
      letter-spacing: 2px;
      color: #ffe4e6;
      text-shadow: 0 0 15px rgba(251, 113, 133, 0.7), 0 0 30px rgba(225, 29, 72, 0.4);
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 1.2s ease, transform 1.2s ease;
      z-index: 10;
      pointer-events: none;
    }

    .title.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Initial Heart Screen */
    .heart-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: opacity 0.8s ease, transform 0.8s ease;
      z-index: 20;
    }

    .tap-text {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: 4px;
      margin-bottom: 24px;
      text-transform: uppercase;
      color: #fbcfe8;
      text-shadow: 0 0 15px rgba(244, 114, 182, 0.8);
      animation: pulseText 1.6s infinite alternate ease-in-out;
    }

    @keyframes pulseText {
      from { opacity: 0.6; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1.03); }
    }

    .glowing-heart {
      position: relative;
      width: 95px;
      height: 85px;
      filter: drop-shadow(0 0 28px #e11d48);
      animation: heartbeat 1.3s infinite ease-in-out;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.16); }
      28% { transform: scale(1); }
      42% { transform: scale(1.16); }
      70% { transform: scale(1); }
    }

    .glowing-heart::before,
    .glowing-heart::after {
      content: "";
      position: absolute;
      left: 48px;
      top: 0;
      width: 48px;
      height: 78px;
      background: linear-gradient(135deg, #f43f5e, #be123c 60%, #880825 100%);
      border-radius: 48px 48px 0 0;
      transform: rotate(-45deg);
      transform-origin: 0 100%;
    }

    .glowing-heart::after {
      left: 0;
      transform: rotate(45deg);
      transform-origin: 100% 100%;
    }

    /* Main Scene Container */
    .scene-container {
      position: relative;
      width: 360px;
      height: 520px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      visibility: hidden;
      opacity: 0;
      transform: scale(0.94);
      transition: opacity 1.2s ease, transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10;
    }

    .scene-container.active {
      visibility: visible;
      opacity: 1;
      transform: scale(1);
    }

    /* Flowers Bouquet Container */
    .flowers-bundle {
      position: absolute;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%);
      width: 340px;
      height: 420px;
      z-index: 1;
      pointer-events: none;
    }

    /* Each Flower Unit */
    .flower {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(var(--angle, 0deg)) scale(0);
      opacity: 0;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.45));
    }

    .scene-container.active .flower {
      animation: flowerBloom 1.5s cubic-bezier(0.18, 0.89, 0.32, 1.25) forwards var(--delay, 0.2s);
    }

    @keyframes flowerBloom {
      0% {
        transform: translateX(-50%) rotate(var(--angle, 0deg)) scale(0);
        opacity: 0;
      }
      65% {
        transform: translateX(-50%) rotate(calc(var(--angle, 0deg) * 1.05)) scale(1.06);
        opacity: 1;
      }
      100% {
        transform: translateX(-50%) rotate(var(--angle, 0deg)) scale(1);
        opacity: 1;
      }
    }

    /* Natural Wind Sway */
    .flower-swayer {
      transform-origin: bottom center;
      animation: naturalSway 4s ease-in-out infinite alternate;
    }

    .flower--1 .flower-swayer { animation-delay: -0.6s; animation-duration: 3.8s; }
    .flower--2 .flower-swayer { animation-delay: -1.4s; animation-duration: 4.2s; }
    .flower--3 .flower-swayer { animation-delay: -2.2s; animation-duration: 3.6s; }
    .flower--4 .flower-swayer { animation-delay: -2.9s; animation-duration: 4.4s; }
    .flower--5 .flower-swayer { animation-delay: -3.5s; animation-duration: 3.9s; }

    @keyframes naturalSway {
      0% { transform: rotate(-2deg); }
      100% { transform: rotate(2.5deg); }
    }

    /* Flower Individual Placements */
    .flower--1 {
      --angle: -24deg;
      --delay: 0.35s;
      height: 290px;
      z-index: 2;
    }

    .flower--2 {
      --angle: -12deg;
      --delay: 0.15s;
      height: 340px;
      z-index: 3;
    }

    .flower--3 {
      --angle: 0deg;
      --delay: 0s;
      height: 380px;
      z-index: 4;
    }

    .flower--4 {
      --angle: 12deg;
      --delay: 0.2s;
      height: 340px;
      z-index: 3;
    }

    .flower--5 {
      --angle: 24deg;
      --delay: 0.4s;
      height: 290px;
      z-index: 2;
    }

    /* Blooming Petal Expansion Keyframes */
    .scene-container.active .petal-expand {
      animation: petalUnfurl 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transform-origin: 50% 65%;
    }

    @keyframes petalUnfurl {
      0% {
        transform: scale(0.65) translateY(12px);
      }
      100% {
        transform: scale(1) translateY(0);
      }
    }

    /* Ambient Baby's Breath / Starlight sprigs */
    .babys-breath {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      height: 280px;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 1.4s ease 0.6s;
    }

    .scene-container.active .babys-breath {
      opacity: 1;
    }

    /* Ambient Golden Fireflies / Sparkles */
    .sparkle {
      position: absolute;
      width: 5px;
      height: 5px;
      background: radial-gradient(circle, #fff7ed 0%, #fde047 50%, rgba(253, 224, 71, 0) 100%);
      border-radius: 50%;
      box-shadow: 0 0 10px #fde047, 0 0 20px #eab308;
      animation: floatSparkle 3s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes floatSparkle {
      0% { transform: translateY(0) scale(0.5); opacity: 0.2; }
      50% { opacity: 1; transform: translateY(-20px) scale(1.2); }
      100% { transform: translateY(-40px) scale(0.4); opacity: 0; }
    }

    /* Florist Bouquet Paper Wrap */
    .bouquet-wrap-container {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 250px;
      z-index: 5;
      pointer-events: none;
    }

    /* Envelope Presentation */
    .envelope-container {
      position: absolute;
      bottom: 80px;
      width: 210px;
      height: 135px;
      background: linear-gradient(135deg, #fbcfe8, #f472b6);
      border-radius: 8px;
      z-index: 6;
      cursor: pointer;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 25px rgba(244, 114, 182, 0.4);
      opacity: 0;
      transform: translateY(40px) scale(0.85);
      transition: all 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .envelope-container.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      animation: envelopeFloat 3s ease-in-out infinite alternate;
    }

    @keyframes envelopeFloat {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 105px solid transparent;
      border-right: 105px solid transparent;
      border-top: 75px solid #ec4899;
      transform-origin: top;
      transition: transform 0.65s ease;
      z-index: 8;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }

    .envelope-container.open .envelope-flap {
      transform: rotateX(180deg);
    }

    .envelope-seal {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 32px;
      background: radial-gradient(circle at 35% 35%, #f43f5e, #be123c);
      border-radius: 50%;
      z-index: 9;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 15px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.35), 0 0 12px rgba(244, 63, 94, 0.6);
      transition: opacity 0.3s;
    }

    .envelope-container.open .envelope-seal {
      opacity: 0;
    }

    /* Popup Letter Modal Card */
    .letter-card {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 330px;
      max-width: 90vw;
      background: linear-gradient(145deg, #ffffff, #fff1f2);
      color: #333333;
      padding: 24px 20px 20px;
      border-radius: 16px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(251, 113, 133, 0.35);
      border: 1px solid rgba(251, 113, 133, 0.3);
      z-index: 100;
      text-align: center;
      transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    .letter-card.active {
      transform: translate(-50%, -50%) scale(1);
    }

    .letter-card h3 {
      font-size: 1.4rem;
      font-family: 'Great Vibes', cursive;
      margin-bottom: 6px;
      color: #be123c;
      letter-spacing: 1px;
    }

    .letter-card p {
      font-size: 0.9rem;
      line-height: 1.45;
      color: #4b5563;
      margin-bottom: 12px;
    }

    .letter-card img {
      width: 140px;
      height: auto;
      margin: 8px 0 14px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .letter-footer {
      font-size: 0.85rem;
      font-weight: 600;
      color: #9f1239;
      line-height: 1.4;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 14px;
      font-size: 22px;
      cursor: pointer;
      color: #9ca3af;
      transition: color 0.2s;
    }

    .close-btn:hover {
      color: #e11d48;
    }
  </style>
</head>
<body>

  <!-- Ambient Starry Sky -->
  <div class="stars" id="stars"></div>
  <div class="moon"></div>

  <!-- Ambient Drifting Petals -->
  <div class="falling-petals-layer" id="fallingPetalsLayer"></div>

  <!-- Header Title -->
  <h1 class="title" id="mainTitle">Flowers For You</h1>

  <!-- Initial Heart Tap Screen -->
  <div class="heart-screen" id="heartScreen">
    <div class="tap-text">TAP TO OPEN</div>
    <div class="glowing-heart"></div>
  </div>

  <!-- Shared Global SVG Gradients & Filters for Botanical Realism -->
  <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
    <defs>
      <!-- Drop Shadow for layered petals -->
      <filter id="petal-shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="3.5" stdDeviation="3" flood-color="#240008" flood-opacity="0.65"/>
      </filter>
      <filter id="leaf-shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#041f0b" flood-opacity="0.5"/>
      </filter>

      <!-- Classic Velvet Red Rose Gradients -->
      <radialGradient id="rose-back-red" cx="50%" cy="40%" r="65%">
        <stop offset="0%" stop-color="#be123c"/>
        <stop offset="55%" stop-color="#880825"/>
        <stop offset="100%" stop-color="#40000a"/>
      </radialGradient>

      <linearGradient id="rose-outer-l" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fb7185"/>
        <stop offset="30%" stop-color="#e11d48"/>
        <stop offset="75%" stop-color="#9f1239"/>
        <stop offset="100%" stop-color="#45010f"/>
      </linearGradient>

      <linearGradient id="rose-outer-r" x1="100%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fb7185"/>
        <stop offset="30%" stop-color="#e11d48"/>
        <stop offset="75%" stop-color="#9f1239"/>
        <stop offset="100%" stop-color="#45010f"/>
      </linearGradient>

      <radialGradient id="rose-bottom-red" cx="50%" cy="75%" r="70%">
        <stop offset="0%" stop-color="#fb7185"/>
        <stop offset="25%" stop-color="#e11d48"/>
        <stop offset="70%" stop-color="#880825"/>
        <stop offset="100%" stop-color="#3b0008"/>
      </radialGradient>

      <radialGradient id="rose-mid-red" cx="50%" cy="35%" r="70%">
        <stop offset="0%" stop-color="#f43f5e"/>
        <stop offset="45%" stop-color="#be123c"/>
        <stop offset="85%" stop-color="#670318"/>
        <stop offset="100%" stop-color="#300007"/>
      </radialGradient>

      <linearGradient id="rose-curl-red" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffe4e6"/>
        <stop offset="45%" stop-color="#fda4af"/>
        <stop offset="100%" stop-color="#e11d48"/>
      </linearGradient>

      <!-- Romantic Blush/Crimson Rose Gradients -->
      <radialGradient id="rose-back-blush" cx="50%" cy="40%" r="65%">
        <stop offset="0%" stop-color="#e11d48"/>
        <stop offset="55%" stop-color="#9f1239"/>
        <stop offset="100%" stop-color="#4c0519"/>
      </radialGradient>

      <linearGradient id="rose-outer-l-blush" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fbcfe8"/>
        <stop offset="30%" stop-color="#f43f5e"/>
        <stop offset="75%" stop-color="#be123c"/>
        <stop offset="100%" stop-color="#550012"/>
      </linearGradient>

      <linearGradient id="rose-outer-r-blush" x1="100%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fbcfe8"/>
        <stop offset="30%" stop-color="#f43f5e"/>
        <stop offset="75%" stop-color="#be123c"/>
        <stop offset="100%" stop-color="#550012"/>
      </linearGradient>

      <!-- Stem & Foliage Gradients -->
      <linearGradient id="stem-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#1e5428"/>
        <stop offset="35%" stop-color="#4ade80"/>
        <stop offset="75%" stop-color="#166534"/>
        <stop offset="100%" stop-color="#0f3d1b"/>
      </linearGradient>

      <linearGradient id="sepal-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4ade80"/>
        <stop offset="40%" stop-color="#15803d"/>
        <stop offset="100%" stop-color="#052e16"/>
      </linearGradient>

      <radialGradient id="leaf-gradient" cx="30%" cy="30%" r="80%">
        <stop offset="0%" stop-color="#4ade80"/>
        <stop offset="45%" stop-color="#16a34a"/>
        <stop offset="85%" stop-color="#14532d"/>
        <stop offset="100%" stop-color="#052e16"/>
      </radialGradient>
    </defs>
  </svg>

  <!-- Main Animated Flower Scene -->
  <div class="scene-container" id="sceneContainer">

    <!-- Ambient Sparkles -->
    <div class="sparkle" style="top: 80px; left: 40px; animation-delay: 0.2s;"></div>
    <div class="sparkle" style="top: 60px; right: 50px; animation-delay: 1.1s;"></div>
    <div class="sparkle" style="top: 130px; left: 80px; animation-delay: 1.8s;"></div>
    <div class="sparkle" style="top: 110px; right: 80px; animation-delay: 0.7s;"></div>

    <!-- Baby's Breath / Gypsophila Sprigs Background -->
    <svg class="babys-breath" viewBox="0 0 280 280">
      <g stroke="#86efac" stroke-width="1.2" stroke-linecap="round" opacity="0.6">
        <path d="M 140,260 Q 120,180 85,120 M 100,150 Q 75,130 55,95 M 115,180 Q 90,165 70,140"/>
        <path d="M 140,260 Q 160,180 195,120 M 180,150 Q 205,130 225,95 M 165,180 Q 190,165 210,140"/>
      </g>
      <!-- Tiny White Blossoms -->
      <g fill="#ffffff" filter="drop-shadow(0 0 4px rgba(255,255,255,0.8))">
        <circle cx="55" cy="95" r="3.2"/>
        <circle cx="70" cy="140" r="2.8"/>
        <circle cx="85" cy="120" r="3"/>
        <circle cx="45" cy="110" r="2.6"/>
        <circle cx="225" cy="95" r="3.2"/>
        <circle cx="210" cy="140" r="2.8"/>
        <circle cx="195" cy="120" r="3"/>
        <circle cx="235" cy="110" r="2.6"/>
      </g>
      <g fill="#fde047">
        <circle cx="55" cy="95" r="1.1"/>
        <circle cx="70" cy="140" r="1"/>
        <circle cx="85" cy="120" r="1"/>
        <circle cx="225" cy="95" r="1.1"/>
        <circle cx="210" cy="140" r="1"/>
        <circle cx="195" cy="120" r="1"/>
      </g>
    </svg>

    <!-- Flowers Bundle -->
    <div class="flowers-bundle">

      <!-- Flower 1: Outer Left -->
      <div class="flower flower--1">
        <div class="flower-swayer">
          <svg viewBox="0 0 160 290" width="125" height="290">
            <!-- Curved Stem -->
            <path d="M 80,110 Q 75,190 80,290" stroke="url(#stem-gradient)" stroke-width="5" stroke-linecap="round" fill="none"/>
            <path d="M 78,160 Q 70,163 66,168 Q 73,169 78,165 Z" fill="#14532d"/>
            <!-- Leaf Left -->
            <g transform="translate(76, 175) rotate(-35)" filter="url(#leaf-shadow)">
              <path d="M 0,0 C -20,-12 -45,-8 -60,0 C -45,12 -20,14 0,0 Z" fill="url(#leaf-gradient)"/>
              <path d="M 0,0 Q -30,0 -60,0" stroke="#86efac" stroke-width="1.2" fill="none" opacity="0.75"/>
              <ellipse cx="-32" cy="-2" rx="2.5" ry="1.8" fill="rgba(255,255,255,0.4)"/>
              <circle cx="-32.5" cy="-2.5" r="0.6" fill="#fff"/>
            </g>
            <!-- Calyx & Sepals -->
            <g filter="url(#petal-shadow)">
              <path d="M 68,105 C 50,115 32,128 22,146 C 36,134 58,122 72,112 Z" fill="url(#sepal-gradient)"/>
              <path d="M 92,105 C 110,115 128,128 138,146 C 124,134 102,122 88,112 Z" fill="url(#sepal-gradient)"/>
              <ellipse cx="80" cy="108" rx="10" ry="7" fill="url(#sepal-gradient)"/>
            </g>
            <!-- Blooming Rose Petals Head -->
            <g class="petal-expand">
              <!-- Outer Back -->
              <path d="M 40,82 C 26,45 55,16 80,18 C 105,16 134,45 120,82 C 102,68 58,68 40,82 Z" fill="url(#rose-back-red)"/>
              <path d="M 58,20 C 70,15 90,15 102,20 C 90,24 70,24 58,20 Z" fill="url(#rose-curl-red)" opacity="0.85"/>
              <!-- Outer Left Petal -->
              <path d="M 55,106 C 30,100 10,80 13,54 C 15,35 40,33 55,48 C 45,68 50,92 55,106 Z" fill="url(#rose-outer-l)" filter="url(#petal-shadow)"/>
              <path d="M 13,54 C 17,39 38,39 52,48 C 39,45 22,47 13,54 Z" fill="url(#rose-curl-red)" opacity="0.9"/>

    <!-- Envelope Trigger -->
    <div class="envelope-container" id="envelope">
      <div class="envelope-flap"></div>
      <div class="envelope-seal">♥</div>
    </div>

  </div>

  <!-- Popup Love Letter Modal Card -->
  <div class="letter-card" id="letterCard">
    <span class="close-btn" id="closeBtn">&times;</span>
    <h3>Dear Love</h3>
    <p>Today is not a special day, but for me it is a unique day.</p>
    <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExdWp3MHU3Y3E3Ynk1bnZwOHI4Z3I1a243aWV2ZWV2ZWV2ZWV2ZWV2JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZF9jdXQmY3Q9cw/MDJ9IbxxvDUQM/giphy.gif" alt="Cute bears hugging">
    <div class="letter-footer">I like you just the way you are. Happy month.</div>
  </div>

  <script>
    // 1. Generate Ambient Stars
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 75; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      const size = Math.random() * 2.8 + 1;
      star.style.width = `${size}px`;
      star.style.height = `${size}px`;
      star.style.left = `${Math.random() * 100}%`;
      star.style.top = `${Math.random() * 100}%`;
      star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
      star.style.animationDelay = `${Math.random() * 3}s`;
      starsContainer.appendChild(star);
    }

    // 2. Generate Ambient Falling Rose Petals
    const fallingLayer = document.getElementById('fallingPetalsLayer');
    function createFallingPetal() {
      const petal = document.createElement('div');
      petal.className = 'drifting-petal';
      petal.style.left = `${Math.random() * 100}%`;
      const duration = Math.random() * 5 + 6;
      petal.style.setProperty('--fall-duration', `${duration}s`);
      petal.style.setProperty('--drift-x', `${(Math.random() - 0.5) * 120}px`);
      const scale = Math.random() * 0.5 + 0.7;
      petal.style.transform = `scale(${scale})`;
      fallingLayer.appendChild(petal);

      setTimeout(() => {
        petal.remove();
      }, duration * 1000);
    }

    // Periodically spawn gentle falling petals
    setInterval(createFallingPetal, 1400);
    for (let i = 0; i < 4; i++) {
      setTimeout(createFallingPetal, i * 400);
    }

    // 3. Elements & Interactions
    const heartScreen = document.getElementById('heartScreen');
    const sceneContainer = document.getElementById('sceneContainer');
    const mainTitle = document.getElementById('mainTitle');
    const envelope = document.getElementById('envelope');
    const letterCard = document.getElementById('letterCard');
    const closeBtn = document.getElementById('closeBtn');

    // Click "Tap to Open"
    heartScreen.addEventListener('click', () => {
      heartScreen.style.opacity = '0';
      heartScreen.style.transform = 'scale(0.85)';

      setTimeout(() => {
        heartScreen.style.display = 'none';
        sceneContainer.classList.add('active');
        mainTitle.classList.add('show');

        // Reveal the floating love envelope
        setTimeout(() => {
          envelope.classList.add('show');
        }, 1600);
      }, 700);
    });

    // Click Envelope to Open Letter
    envelope.addEventListener('click', () => {
      envelope.classList.add('open');
      setTimeout(() => {
        letterCard.classList.add('active');
      }, 550);
    });

    // Close Letter Card
    closeBtn.addEventListener('click', () => {
      letterCard.classList.remove('active');
    });

    // Tap/Click anywhere to sprinkle fluttering rose petals
    window.addEventListener('pointerdown', (e) => {
      // Don't trigger when clicking modal or envelope
      if (e.target.closest('#letterCard') || e.target.closest('#envelope')) return;

      for (let i = 0; i < 4; i++) {
        const petal = document.createElement('div');
        petal.className = 'drifting-petal';
        petal.style.left = `${e.clientX + (Math.random() - 0.5) * 60}px`;
        petal.style.top = `${e.clientY + (Math.random() - 0.5) * 40}px`;
        const dur = Math.random() * 3 + 3.5;
        petal.style.setProperty('--fall-duration', `${dur}s`);
        petal.style.setProperty('--drift-x', `${(Math.random() - 0.5) * 160}px`);
        fallingLayer.appendChild(petal);

        setTimeout(() => {
          petal.remove();
        }, dur * 1000);
      }
    });
  </script>
</body>
</html>
